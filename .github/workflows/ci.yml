name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontier_explorer:
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
          apt-get install -y python3-pytest python3-flake8 shellcheck

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select frontier_explorer

      - name: Unit tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          cd src/frontier_explorer && python3 -m pytest test -q

      - name: Lint Python
        run: python3 -m flake8 --max-line-length 110 --exclude template_node.py src/frontier_explorer sim/fake_zed.py

      - name: Check shell scripts
        run: shellcheck -S error sim/*.sh hw/*.sh
